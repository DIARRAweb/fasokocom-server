<style>
body{

@media (max-width: 768px){

<body>

🛡️ Commandement
</button>


<script>
window.fullName = prompt("Nom + Grade") || "Agent";
window.userType = prompt("Type (agent / moto / vehicule / helico / chasseur)") || "agent";
</script>

<script type="module">
import { initializeApp } from
"https://www.gstatic.com/firebasejs/12.10.0/firebase-app.js";

import { getDatabase, ref, set, onValue, onDisconnect, remove } from
"https://www.gstatic.com/firebasejs/12.10.0/firebase-database.js";

// 🔥 CONFIG FIREBASE
const firebaseConfig = {
  apiKey: "AIzaSyA83FA1Ne_qjYoIYHtsOXc7j3h3bdTOgLQ",
  authDomain: "fasokocom2.firebaseapp.com",
  projectId: "fasokocom2",
  storageBucket: "fasokocom2.firebasestorage.app",
  messagingSenderId: "730331164569",
  appId: "1:730331164569:web:8e984ad9d88a30bf2c2d08"
};

// 🔥 INITIALISATION
const app = initializeApp(firebaseConfig);
const db = getDatabase(app);

// 🆔 ID UTILISATEUR UNIQUE
let userId = "agent_" + Math.floor(Math.random() * 1000000);

// 📡 RÉFÉRENCE FIREBASE
let userRef = ref(db, "users/" + userId);

// 🧹 SUPPRESSION AUTOMATIQUE SI DÉCONNECTÉ
onDisconnect(userRef).remove();


let map;

function initMap() {

  map = L.map('map', {
    zoomControl: false
  }).setView([12.6392, -8.0029], 13);

  // 🔍 Zoom à gauche
  L.control.zoom({ position: 'topleft' }).addTo(map);

  // 🌍 Layer par défaut
  currentLayer = normalLayer;
  currentLayer.addTo(map);

  // 🖥 Fullscreen
  map.addControl(new L.Control.Fullscreen({
    position: 'topleft'
  }));

  // 🧭 Boussole
  northControl.addTo(map);

  // 🗺 Bouton menu carte
  styleControl.addTo(map);
}
// ✅ attendre que la page soit prête
window.onload = initMap;


const northControl = L.control({ position: 'topleft' });

northControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'leaflet-bar');

  div.innerHTML = '<a href="#">🧭</a>';

  div.onclick = function (e) {
    e.preventDefault();
    map.setView([12.6392, -8.0029], map.getZoom());
  };

  return div;
};


/// =============================
// 🎛 MENU + SWITCH LAYERS (LEAFLET)
// =============================

let currentLayer;

// 🌍 Layers
const normalLayer = L.tileLayer(
  'https://{s}.basemaps.cartocdn.com/light_all/{z}/{x}/{y}{r}.png',
  { attribution: '&copy; CARTO' }
);

const satelliteLayer = L.tileLayer(
  'https://services.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
  { attribution: '© Esri' }
);

const reliefLayer = L.tileLayer(
  'https://{s}.tile.opentopomap.org/{z}/{x}/{y}.png',
  { attribution: '© OpenTopoMap' }
);

// =============================
// 📦 MENU HTML
// =============================
let menu = document.createElement("div");
menu.className = "mapMenu";

menu.innerHTML = `
<button id="styleNormal">🗺 Normal</button>
<button id="styleSatellite">🛰 Satellite</button>
<button id="styleRelief">⛰ Relief</button>
`;

window.addEventListener("DOMContentLoaded", () => {
  document.body.appendChild(menu);
});

// =============================
// 🔁 TOGGLE MENU
// =============================
function toggleMenu() {
  menu.style.display = (menu.style.display === "block") ? "none" : "block";
}

window.toggleMenu = toggleMenu;

// =============================
// 🗺 BOUTON DANS LA CARTE (LEAFLET)
// =============================
const styleControl = L.control({ position: 'topright' });

styleControl.onAdd = function () {
  const div = L.DomUtil.create('div', 'leaflet-bar');

  const btn = L.DomUtil.create('a', '', div);
  btn.innerHTML = "🗺";
  btn.href = "#";
  btn.title = "Changer la carte";

  btn.style.fontSize = "18px";
  btn.style.width = "30px";
  btn.style.height = "30px";
  btn.style.display = "flex";
  btn.style.alignItems = "center";
  btn.style.justifyContent = "center";
  btn.style.background = "white";

  L.DomEvent.disableClickPropagation(div);

  btn.onclick = function (e) {
    e.preventDefault();
    toggleMenu();
  };

  return div;
};

// =============================
// 🔄 CHANGEMENT DE STYLE
// =============================
function setMapLayer(layer) {
  if (currentLayer) {
    map.removeLayer(currentLayer);
  }
  currentLayer = layer;
  currentLayer.addTo(map);
}

// Boutons menu
document.getElementById("styleNormal").onclick = () => {
  setMapLayer(normalLayer);
  reloadMarkers();
  menu.style.display = "none";
};

document.getElementById("styleSatellite").onclick = () => {
  setMapLayer(satelliteLayer);
  reloadMarkers();
  menu.style.display = "none";
};

document.getElementById("styleRelief").onclick = () => {
  setMapLayer(reliefLayer);
  reloadMarkers();
  menu.style.display = "none";
};

// =============================
// 📍 MARKERS (inchangé)
// =============================
let markers = {};
window.lastData = {};

function updateMarker(id, lat, lon, popupText, user) {
  if (!user || lat == null || lon == null) return;

  // 🟢 Si marker existe → mise à jour
  if (markers[id]) {
    markers[id].setLatLng([lat, lon]);

    let popup = markers[id].getPopup();
    if (popup) {
      popup.setContent(popupText);
    } else {
      markers[id].bindPopup(popupText);
    }

    return;
  }

  // =========================
  // 🎨 CRÉATION ICON
  // =========================
  let icon;

  // 👤 AGENT / CHEF
  if (user.type === "agent" || user.type === "chef") {
    let color = (id === userId) ? "#00ff00" : "red";
    let size = (user.type === "chef") ? 10 : 8;

    icon = L.divIcon({
      html: `<div style="
        width:${size}px;
        height:${size}px;
        background:${color};
        border:2px solid white;
        border-radius:50%;
        box-shadow:0 0 8px ${color};
      "></div>`,
      className: "",
      iconSize: [size, size]
    });
  }

  // 🚁 🚓 🏍️ ✈️ ENGINS
  else {
    let emoji = "🚓";
    if (user.type === "moto") emoji = "🏍️";
    if (user.type === "vehicule") emoji = "🚓";
    if (user.type === "helico") emoji = "🚁";
    if (user.type === "chasseur") emoji = "✈️";

    icon = L.divIcon({
      html: `<div style="font-size:24px;">${emoji}</div>`,
      className: "",
      iconSize: [24, 24]
    });
  }

  // =========================
  // 📍 CRÉATION MARKER
  // =========================
  markers[id] = L.marker([lat, lon], { icon: icon })
    .addTo(map)
    .bindPopup(popupText);
}

// 🔄 Recharger les markers (utile si besoin)
function reloadMarkers() {
  if (!window.lastData) return;

  // supprimer anciens markers
  for (let id in markers) {
    markers[id].remove();
    delete markers[id];
  }

  // recréer markers
  // recréer markers
  for (let id in window.lastData) {
    let user = window.lastData[id];

    if (user.latitude == null || user.longitude == null) continue;

    let displayName = user.name || "Agent";
    let popupText =
      "<b>" + displayName + "</b><br>Précision: " +
      Math.round(user.accuracy || 0) + " m";

    updateMarker(id, user.latitude, user.longitude, popupText, user);
  }
}

// ---------------- MA POSITION (VERSION PRO) ----------------
window.showPosition = function () {

  navigator.geolocation.getCurrentPosition(

    (pos) => {
      let lat = pos.coords.latitude;
      let lon = pos.coords.longitude;
      let accuracy = pos.coords.accuracy;

      // 📍 afficher infos utilisateur
      document.getElementById("position").innerHTML =
        "📍 Latitude : " + lat +
        "<br>📍 Longitude : " + lon +
        "<br>🎯 Précision : " + Math.round(accuracy) + " m";

      // 🎬 Animation fluide vers la position
      map.flyTo([lat, lon], 17, {
        animate: true,
        duration: 2 // vitesse (2 secondes)
      });

      // 📌 Ajouter ou mettre à jour ton marker perso
      if (window.myMarker) {
        window.myMarker.setLatLng([lat, lon]);
      } else {
        window.myMarker = L.marker([lat, lon])
          .addTo(map)
          .bindPopup("📍 Vous êtes ici")
          .openPopup();
      }
    },

    (err) => {
      alert("❌ Erreur GPS : " + err.message);
    },

    {
      enableHighAccuracy: true,
      timeout: 10000,
      maximumAge: 0
    }

  );
};

// ---------------- CARTE DE L'EQUIPE (VERSION PRO) ----------------
window.showMap = function () {

  if (!map) {
    alert("❌ Carte non initialisée");
    return;
  }

  let bounds = L.latLngBounds([]);
  let count = 0;

  for (let id in markers) {
    let marker = markers[id];

    if (!marker || !marker.getLatLng) continue;

    bounds.extend(marker.getLatLng());
    count++;
  }

  // 🚫 Aucun agent
  if (count === 0) {
    alert("⚠️ Aucun agent trouvé sur la carte.");
    return;
  }

  // 🎬 Animation vers tous les agents
  map.flyToBounds(bounds, {
    padding: [50, 50],
    maxZoom: 16,
    duration: 2 // animation fluide
  });

};

// ---------------- TRACKING + ENVOI FIREBASE ----------------
navigator.geolocation.watchPosition(

  (pos) => {
    let lat = pos.coords.latitude;
    let lon = pos.coords.longitude;
    let accuracy = pos.coords.accuracy;

    // 🎯 ignorer si trop imprécis
    if (accuracy > 50) return;

    // 📡 envoyer à Firebase
    set(userRef, {
      name: window.fullName || "Agent",
      type: window.userType || "agent",
      socketId: window.socketId || null,

      latitude: lat,
      longitude: lon,
      accuracy: accuracy,

      status: "online",
      timestamp: Date.now()
    });

  },

  (err) => {
    console.log("❌ Erreur GPS :", err.message);
  },

  {
    enableHighAccuracy: true,
    timeout: 10000,
    maximumAge: 0
  }

);

// ---------------- LECTURE TEMPS REEL ----------------
onValue(ref(db, "users"), (snapshot) => {

  const data = snapshot.val();
  if (!data) return;

  window.lastData = data;

  // 👥 compteur
  document.getElementById("agentCount").innerText = Object.keys(data).length;

  // 📋 liste agents
  let ul = document.getElementById("agentsUl");
  ul.innerHTML = "";

  for (let id in data) {
    let u = data[id];

    let nom = u.name || "Agent";
    let precision = Math.round(u.accuracy || 0);

    let li = document.createElement("li");

    li.innerHTML =
      "🟢 <b>" + nom + "</b><br>📍 Précision: " + precision + " m";

    // 🎬 zoom vers agent (Leaflet)
    li.onclick = () => {
      if (u.latitude && u.longitude) {
        map.flyTo([u.latitude, u.longitude], 16, {
          animate: true,
          duration: 1.5
        });
      }
    };

    ul.appendChild(li);
  }

  // 🧹 supprimer anciens markers inexistants
  for (let id in markers) {
    if (!data[id]) {
      markers[id].remove();
      delete markers[id];
    }
  }

  // 🔄 mise à jour markers
  for (let id in data) {
    let user = data[id];

    // ⏱ supprimer fantômes (+2 min)
    if (user.timestamp && (Date.now() - user.timestamp > 120000)) {
      remove(ref(db, "users/" + id));
      continue;
    }

    if (!user.latitude || !user.longitude) continue;

    let displayName = user.name || "Agent";

    let popupText =
      "<b>" + displayName + "</b><br>📍 Précision: " +
      Math.round(user.accuracy || 0) + " m";

    updateMarker(id, user.latitude, user.longitude, popupText, user);
  }

});
</script>

<script src="https://cdn.jsdelivr.net/npm/livekit-client/dist/livekit-client.umd.min.js"></script>

<script>
let room;
let localTrack;

// 📞 APPEL
async function startCall() {
  try {
    const res = await fetch("https://fasokocom-server.onrender.com/getToken?room=faso&name=" + window.fullName);
    const data = await res.json();

    room = new LivekitClient.Room();

    // 🔗 connexion
    await room.connect("wss://fasokocom-ljsej3qt.livekit.cloud", data.token);
    console.log("✅ connecté");

    // 🔊 écouter AVANT publication
    room.on("trackSubscribed", (track, publication, participant) => {
      if (track.kind === "audio") {
        const audio = track.attach();
        audio.autoplay = true;
        audio.playsInline = true;
        document.getElementById("audioContainer").appendChild(audio);

        console.log("🔊 reçu de", participant.identity);
      }
    });

    // 🔥 ATTENDRE que LiveKit stabilise
    await new Promise(resolve => setTimeout(resolve, 1000));

    // 🎤 activer micro APRÈS
    await room.localParticipant.setMicrophoneEnabled(true);

    document.getElementById("status").innerText = "🔴 En appel";

    setupAudioVisualization();

  } catch (err) {
    console.error(err);
    alert("Erreur connexion appel : " + err.message);
  }
}

// ❌ raccrocher
function hangUp() {
  if (room) {
    room.disconnect();
    document.getElementById("status").innerText = "🟢 Connecté";
  }
}

// 🎤 mute
function toggleMute() {
  if (room) {
    const enabled = room.localParticipant.isMicrophoneEnabled;
    room.localParticipant.setMicrophoneEnabled(!enabled);
  }
}
</script>

<script src="https://fasokocom-server.onrender.com/socket.io/socket.io.js"></script>

<script>
const socket = io("https://fasokocom-server.onrender.com");

let routeControl;

socket.on("receiveRoute", (data) => {
  console.log("📍 ITINÉRAIRE REÇU :", data);

  if (!map) {
    console.log("❌ Map pas prête !");
    return;
  }

  if (routeControl) {
    map.removeControl(routeControl);
  }

  routeControl = L.Routing.control({
    waypoints: [
      L.latLng(data.start.lat, data.start.lng),
      L.latLng(data.end.lat, data.end.lng)
    ],
    routeWhileDragging: false
  }).addTo(map);
});

// 📍 envoyer position + Firebase en même temps
navigator.geolocation.watchPosition(position => {
  const lat = position.coords.latitude;
  const lng = position.coords.longitude;
  const accuracy = position.coords.accuracy;

  if (accuracy > 50) return;

  const data = {
    name: window.fullName,
    lat: lat,
    lng: lng
  };

  console.log("📤 ENVOI SOCKET :", data);

  // 🔥 Socket (commandement)
  socket.emit("updatePosition", data);

  // 🔥 Firebase (carte locale)
  set(userRef, {
    name: window.fullName,
    type: window.userType,
    latitude: lat,
    longitude: lng,
    accuracy: accuracy,
    timestamp: Date.now()
  });

});
</script>
